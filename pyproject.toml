[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbot"
version = "0.4.12"
description = "A local-first agent harness: an async Python runtime giving AI agents a workspace, persistent state, host tool access, and server/WebUI/desktop/CLI accessors."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "The vBot Authors" }]
keywords = ["ai", "agent", "llm", "agentic", "fastapi", "svelte", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["psutil", "pillow>=12.3,<13", "pillow-heif>=1.8,<2", "mcp==2.2.0", "httpx2>=2.5,<3", "anyio>=4.10,<5", "httpx", "sniffio>=1.3,<2", "idna>=3,<4", "curl_cffi>=0.7,<1", "pyyaml", "croniter", "python-dateutil", "tzdata", "tzlocal>=5,<6", "beautifulsoup4", "markdownify>=1.2.3,<2", "pypdf>=6,<7", "sqlite-vec>=0.1.9,<0.2", "pathspec>=1.1", "jsonschema>=4.25,<5", "tiktoken>=0.13,<1", "websockets>=15,<18", "pyte>=0.8.2,<0.9", "pywinpty>=3,<4; sys_platform == 'win32'"]

[project.scripts]
vbot = "cli.main:main"

[project.urls]
Homepage = "https://github.com/Vironnimo/vbot"
Repository = "https://github.com/Vironnimo/vbot"
Issues = "https://github.com/Vironnimo/vbot/issues"

[project.optional-dependencies]
server  = ["fastapi", "starlette>=0.48,<2", "uvicorn[standard]", "watchfiles", "python-telegram-bot[rate-limiter]", "discord.py>=2.7,<3", "python-multipart", "av>=18,<19", "psutil"]
cli     = ["psutil", "cryptography>=46,<51"]
application = ["cryptography>=46,<51", "uv==0.12.11"]
local-tts = ["uv==0.12.11"]
local-speech = ["torch>=2.10,<3", "transformers>=5.16.1,<6", "huggingface-hub>=1.30,<2", "librosa>=0.11,<1", "av>=18,<19"]
desktop = ["pywebview", "pyopen-wakeword>=1.1,<2", "sounddevice", "soxr>=0.5,<2", "onnxruntime>=1.16,<2", "livekit>=1.1.20,<1.2", "PyAudioWPatch>=0.2.12.8,<0.3; sys_platform == 'win32'"]
dev     = ["pytest", "pytest-asyncio", "ruff==0.16.9", "mypy==2.3.1", "types-jsonschema", "types-python-dateutil", "hatchling", "pytest-xdist", "pytest-timeout", "pytest-cov", "respx", "fastapi", "starlette>=0.48,<2", "uvicorn[standard]", "watchfiles", "python-telegram-bot[rate-limiter]", "discord.py>=2.7,<3", "python-multipart", "psutil", "numpy", "soxr>=0.5,<2", "av>=18,<19", "py-spy>=0.4.2,<0.5", "reportlab>=4.2,<6", "pypdfium2>=4.30,<6", "cryptography>=46,<51", "playwright==1.63.0"]

[tool.hatch.build.targets.sdist]
exclude = ["/archive", "**/node_modules/**"]

[tool.hatch.build.targets.wheel]
packages = ["core", "server", "cli", "desktop"]
exclude = ["**/node_modules/**"]

[tool.vbot.native-dependencies]
ripgrep = "resources/ripgrep.lock.json"

[tool.pytest.ini_options]
addopts = "-n auto --dist=worksteal --timeout=30 --import-mode=importlib -m \"not stress\""
markers = [
    "stress: load test outside the normal suite; run with `python -m pytest -m stress`",
    "durable: the test observes production disk syncs (SQLite synchronous levels, os.fsync)",
]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
# vBot runs on 3.14 (PROJECT.md -> Development -> Python version). Files that
# other interpreters run keep their own targets.
target-version = "py314"
line-length = 100

[tool.ruff.per-file-target-version]
# Every managed speech environment runs this worker; Chatterbox's runs Python 3.13.
"core/model_tasks/speech_worker.py" = "py313"
# Bundled Skill scripts run on the host's `python`; they support 3.9 and later.
"resources/skills/*/scripts/**/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF007"]
# UP requires PEP 695 syntax: `type` aliases and type parameter lists instead of
# TypeAlias, TypeVar and Generic (UP040, UP046, UP047, UP049). UP047 skips
# methods; give generic methods type parameter lists all the same.

[tool.ruff.lint.per-file-ignores]
"scripts/test-env.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["core", "server", "cli", "desktop", "tests"]
mypy_path = "scripts"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# Every overriding method carries `@typing.override`, so renaming or removing a
# base method fails the check instead of silently orphaning its overrides.
enable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
module = [
    "pyopen_wakeword",
    "pyopen_wakeword.*",
    "onnxruntime",
    "sounddevice",
    "soxr",
    "winpty",
    "yaml",
    "markdownify",
    "pypdfium2",
    "reportlab.*",
]
ignore_missing_imports = true

# SDK stacks live in separate managed Python environments, never in the server.
# An environment runs on the server's Python (major.minor) unless its recipe names
# `python`; setup creates it again whenever its Python differs.
[tool.vbot.local-tts.qwen3-tts]
packages = ["qwen-tts==0.1.1"]
torch = "2.11.0"

[tool.vbot.local-tts.chatterbox]
# Python 3.13, not the server's: chatterbox-tts depends on spacy-pkuseg, whose
# wheels (1.0.1) stop at CPython 3.13. Move to the server's Python once it has
# wheels there (chatterbox-tts 0.1.7 then requires torch>=2.9), together with the
# speech worker's older-Python checks (PROJECT.md -> Development -> Python version).
python = "3.13"
packages = ["chatterbox-tts==0.1.7"]
# PyPI 0.1.7 supplies dependencies; this pinned official source adds V3.
source = "https://github.com/resemble-ai/chatterbox/archive/5de7a54aa4e5e2baadb0182dde554908b48b85c2.zip"
source-package = "chatterbox-tts"
torch = "2.6.0"

# The local embedding engine's environment, shared by every local embedding Model.
[tool.vbot.local-embeddings.onnx]
packages = ["onnxruntime==1.26.0", "tokenizers==0.23.2", "numpy==2.5.2", "onnx==1.21.0"]
