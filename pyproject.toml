[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbot"
version = "0.3.7"
description = "A local-first agent harness: an async Python runtime giving AI agents a workspace, persistent state, host tool access, and server/WebUI/desktop/CLI accessors."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "The vBot Authors" }]
keywords = ["ai", "agent", "llm", "agentic", "fastapi", "svelte", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["httpx", "idna>=3,<4", "curl_cffi>=0.7,<1", "pyyaml", "croniter", "python-dateutil", "tzdata", "tzlocal>=5,<6", "beautifulsoup4", "pypdf>=6,<7", "sqlite-vec>=0.1.9,<0.2", "pathspec>=1.1", "jsonschema>=4.25,<5", "tiktoken>=0.13,<1", "websockets>=14,<18", "pyte>=0.8.2,<0.9", "pywinpty>=3,<4; sys_platform == 'win32'", "ptyprocess>=0.7,<1; sys_platform != 'win32'"]

[project.scripts]
vbot = "cli.main:main"

[project.gui-scripts]
vbot-autostart = "cli.autostart_management:windows_autostart_main"
vbot-desktop = "desktop.main:main"

[project.urls]
Homepage = "https://github.com/Vironnimo/vbot"
Repository = "https://github.com/Vironnimo/vbot"
Issues = "https://github.com/Vironnimo/vbot/issues"

[project.optional-dependencies]
server  = ["fastapi", "uvicorn[standard]", "watchfiles", "python-telegram-bot[rate-limiter]", "discord.py>=2.7,<3", "python-multipart", "av>=18,<19"]
cli     = ["psutil"]
desktop = ["pywebview", "pyopen-wakeword>=1.1,<2", "sounddevice", "soxr>=0.5,<2", "webrtcvad-wheels>=2.0.14,<3"]
dev     = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-jsonschema", "types-python-dateutil", "hatchling", "pytest-xdist", "pytest-timeout", "respx", "fastapi", "uvicorn[standard]", "watchfiles", "python-telegram-bot[rate-limiter]", "discord.py>=2.7,<3", "python-multipart", "psutil", "numpy", "soxr>=0.5,<2", "av>=18,<19"]

[tool.hatch.build.targets.wheel]
packages = ["core", "server", "cli", "desktop"]

[tool.pytest.ini_options]
addopts = "-n auto --timeout=30 --import-mode=importlib"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 3.12 rather than our 3.11 runtime floor: current third-party stubs (numpy)
# use `type` statements and cannot be parsed under 3.11. Floor syntax stays
# guarded by ruff's py311 target and the real 3.11 test runs in CI.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ptyprocess",
    "pyopen_wakeword",
    "pyopen_wakeword.*",
    "sounddevice",
    "soxr",
    "webrtcvad",
    "winpty",
    "yaml",
]
ignore_missing_imports = true
