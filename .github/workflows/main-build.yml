name: Main build

# Runs on every push to main: the complete CI and the signed main-channel
# packages build side by side, and only a commit whose CI and packages all
# passed is published to the rolling prerelease `main-build`. Installations on
# the main channel install and update from it; `releases/latest` never lists a
# prerelease. Main packages skip the release-only smokes (managed speech
# provisioning, compiled installer); release.yml runs every smoke. Packages
# upload before vbot-release.json, so the published identity never names a
# version whose packages are still missing. While a build replaces the assets,
# the digests of the previous identity disagree with them; the installers then
# ask to try again. Pushes that change only development documentation, which no
# package ships and no test reads, run nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".vorch/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "USAGE.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer run supersedes the CI and package jobs of an older one still in
# progress; the older run then publishes nothing. Its publish job, once
# started, always finishes.
jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: main-build-ci
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml

  windows:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: main-build-windows
      cancel-in-progress: true
    uses: ./.github/workflows/windows-package.yml
    with:
      release_mode: true
      channel: main
      release_smoke: false
    secrets: inherit

  linux:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: main-build-linux
      cancel-in-progress: true
    uses: ./.github/workflows/linux-package.yml
    with:
      release_mode: true
      channel: main
    secrets: inherit

  publish:
    needs: [ci, windows, linux]
    # Publishing is never cancelled halfway; a newer run waits for it.
    concurrency:
      group: main-build-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          pattern: vbot-*
          path: assets
          merge-multiple: true
      # The installers verify their downloads against the digests vbot-release.json records.
      - name: Validate complete main build assets and record their digests
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python scripts/release_assets.py --dir assets --version "$version" --revision "$BUILD_SHA" --channel main --record-digests
      - name: Publish to the main-build prerelease
        run: |
          notes="Signed packages of main at ${BUILD_SHA}. Install with \`install.sh --main\` or \`install.ps1 -Main\`; such installations update from here."
          if ! gh release view main-build >/dev/null 2>&1; then
            gh release create main-build --prerelease --target "$BUILD_SHA" --title "main build" --notes "$notes"
          fi
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/main-build" -f sha="$BUILD_SHA" -F force=true >/dev/null
          find assets -type f ! -name vbot-release.json -print0 | xargs -0 gh release upload main-build --clobber
          gh release upload main-build --clobber assets/vbot-release.json
          # Assets an earlier build published and this one no longer does.
          gh release view main-build --json assets --jq '.assets[].name' | while read -r name; do
            if [ ! -e "assets/$name" ]; then gh release delete-asset main-build "$name" --yes; fi
          done
          gh release edit main-build --prerelease --notes "$notes"
