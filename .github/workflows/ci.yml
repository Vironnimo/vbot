name: CI

# Complete verification on every supported platform, with the one Python version
# vBot supports (the one its packages bundle). main-build.yml calls it on every
# push to main, and it can be started by hand. A release requires the main-build
# run of its commit to have passed it (scripts/release_gate.py).
# Before it pushes main, scripts/push.py runs its static checks, test suites and
# WebUI build locally.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: static (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runner: ubuntu-latest
          - platform: windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked backend verification dependencies
        shell: bash
        run: |
          python scripts/test_dependencies.py install --environment "$RUNNER_TEMP/vbot-tests"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/vbot-tests" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$RUNNER_TEMP/vbot-tests/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/vbot-tests/bin" >> "$GITHUB_PATH"
          fi
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy
      # Managed speech environments also run the speech worker on Python 3.13
      # (scripts/commit_check.OLDER_PYTHON_FILES and OLDER_PYTHON_VERSION).
      - name: Type-check the speech worker for Python 3.13
        run: >-
          python -m mypy --python-version 3.13 --follow-imports skip
          core/model_tasks/speech_worker.py

  backend:
    name: backend (${{ matrix.platform }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runner: ubuntu-latest
          - platform: linux arm64
            runner: ubuntu-24.04-arm
          # Windows runs the suite several times slower; split it across jobs.
          - { platform: windows x64, runner: windows-latest, shard: 1/3 }
          - { platform: windows x64, runner: windows-latest, shard: 2/3 }
          - { platform: windows x64, runner: windows-latest, shard: 3/3 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VBOT_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/packaged-python
      - name: Install locked backend verification dependencies
        shell: bash
        run: |
          python scripts/test_dependencies.py install --environment "$RUNNER_TEMP/vbot-tests"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/vbot-tests" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$RUNNER_TEMP/vbot-tests/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/vbot-tests/bin" >> "$GITHUB_PATH"
          fi
      - name: Provision the pinned search engine
        run: python -m cli.search_runtime
      - name: Provision the token estimation encodings
        # tiktoken downloads an encoding on first use, without a timeout; the
        # tests then read this job's cache instead of the network.
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); tiktoken.get_encoding('cl100k_base')"
      - name: Provision the pinned PDF printing browser
        # The live PDF test needs a working browser, not the runner image's
        # desktop Chromium and its sandbox restrictions. Install the headless
        # shell preferred by PDF discovery through the pinned dev dependency,
        # the way the PDF Skill's own browser setup does.
        if: matrix.platform == 'linux x64'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pdf-browser
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Warm the native host toolchain
        # The first clang-cl build on a fresh runner reads cold LLVM and SDK files
        # for 20-30 s, more than a test may take; later builds take seconds.
        if: runner.os == 'Windows'
        run: python -c "import tempfile; from pathlib import Path; from scripts.windows.native_hosts import compile_host; compile_host(Path.cwd(), Path(tempfile.mkdtemp()) / 'vBot.exe', role='host', version='0.0.0')"
      - name: Run backend tests
        # Retry failures for diagnosis; a passing retry never clears the first failure.
        shell: bash
        env:
          # Tests isolate HOME; keep the provisioned PDF browser discoverable.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pdf-browser
          VBOT_TEST_CRASH_LOG_DIR: ${{ runner.temp }}/vbot-test-crashes
        run: |
          status=0
          python -m pytest --durations=25 || status=$?
          if [ -d "$VBOT_TEST_CRASH_LOG_DIR" ]; then
            find "$VBOT_TEST_CRASH_LOG_DIR" -type f -name '*.log' -size +0c -print -exec cat {} \;
          fi
          if [ "$status" -ne 1 ]; then exit "$status"; fi
          python -c 'import json; print(*sorted(json.load(open(".pytest_cache/v/cache/lastfailed", encoding="utf-8"))), sep="\n")' > failed.txt
          if [ ! -s failed.txt ]; then exit 1; fi
          echo "::group::Run the $(wc -l < failed.txt) failed tests again, alone"
          retry_status=0
          python -m pytest --last-failed --last-failed-no-failures none -n 0 || retry_status=$?
          echo "::endgroup::"
          echo "::error title=Backend tests failed::The first suite failed; isolated retry exit code: $retry_status"
          {
            echo "### Backend test failures (${{ matrix.platform }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})"
            echo "The first suite failed. Isolated retry exit code: $retry_status. These failures still block publication:"
            sed 's/^/- `/; s/$/`/' failed.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Refuse AI tool attribution in the history
        run: python3 scripts/commit_authorship.py history

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run frontend tests
        run: npx vitest run
      - name: Build WebUI
        run: npm run build
