name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.platform }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runner: ubuntu-latest
            python: "3.11"
          - platform: linux arm64
            runner: ubuntu-24.04-arm
            python: "3.11"
          - platform: windows x64
            runner: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend quality gate
        run: python scripts/quality.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Run frontend quality gate
        run: python scripts/quality-frontend.py

  install-linux:
    name: install-linux (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare prebuilt WebUI fixture
        run: mkdir -p webui/dist && printf '<!doctype html>\n' > webui/dist/index.html
      - name: Install into an isolated environment
        run: |
          python -m venv .tmp/install-venv
          . .tmp/install-venv/bin/activate
          bash scripts/install.sh --no-autostart --skip-webui-build --data-dir .tmp/data
          python -c 'import json, pathlib; state=json.loads(pathlib.Path(".vbot-install.json").read_text()); assert state["install_shape"] == "server"; assert state["dependency_groups"] == ["server", "cli"]'
      - name: Uninstall through the recorded interpreter
        run: |
          bash scripts/uninstall.sh
          test ! -f .vbot-install.json
          ! .tmp/install-venv/bin/python -m pip show vbot

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare prebuilt WebUI fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path webui/dist -Force | Out-Null
          Set-Content -LiteralPath webui/dist/index.html -Value '<!doctype html>' -Encoding utf8
      - name: Install into an isolated environment
        shell: pwsh
        run: |
          python -m venv .tmp/install-venv
          $env:Path = "$(Resolve-Path .tmp/install-venv/Scripts);$env:Path"
          & scripts/install.ps1 -NoAutostart -SkipWebuiBuild -SkipPathUpdate -DataDir .tmp/data
          $state = Get-Content -Raw .vbot-install.json | ConvertFrom-Json
          if ($state.install_shape -ne 'server') { throw 'wrong install shape' }
          if (($state.dependency_groups -join ',') -ne 'server,cli') { throw 'wrong dependency groups' }
      - name: Uninstall through the recorded interpreter
        shell: pwsh
        run: |
          & scripts/uninstall.ps1
          if (Test-Path .vbot-install.json) { throw 'installation manifest was not removed' }
          & .tmp/install-venv/Scripts/python.exe -m pip show vbot
          if ($LASTEXITCODE -eq 0) { throw 'vbot is still installed' }
          exit 0
