name: CI

# Complete verification on every supported platform and Python version: on every
# push to main, as the release gate (release.yml), and by hand. Before it pushes
# main, scripts/push.py runs its static checks, test suites and WebUI build locally.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the run of an older one that is still in progress;
# runs started by hand or by a release always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  static:
    name: static (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runner: ubuntu-latest
          - platform: windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy

  backend:
    name: backend (${{ matrix.platform }}, Python ${{ matrix.python }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runner: ubuntu-latest
            python: "3.11"
          - platform: linux x64
            runner: ubuntu-latest
            python: "3.13"
          - platform: linux x64
            runner: ubuntu-latest
            python: "3.14"
          - platform: linux arm64
            runner: ubuntu-24.04-arm
            python: "3.11"
          # Windows runs the suite several times slower; split it across jobs.
          - { platform: windows x64, runner: windows-latest, python: "3.11", shard: 1/3 }
          - { platform: windows x64, runner: windows-latest, python: "3.11", shard: 2/3 }
          - { platform: windows x64, runner: windows-latest, python: "3.11", shard: 3/3 }
          - { platform: windows x64, runner: windows-latest, python: "3.14", shard: 1/3 }
          - { platform: windows x64, runner: windows-latest, python: "3.14", shard: 2/3 }
          - { platform: windows x64, runner: windows-latest, python: "3.14", shard: 3/3 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VBOT_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Provision the pinned search engine
        run: python -m cli.search_runtime
      - name: Provision the token estimation encodings
        # tiktoken downloads an encoding on first use, without a timeout; the
        # tests then read this job's cache instead of the network.
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); tiktoken.get_encoding('cl100k_base')"
      - name: Warm the native host toolchain
        # The first clang-cl build on a fresh runner reads cold LLVM and SDK files
        # for 20-30 s, more than a test may take; later builds take seconds.
        if: runner.os == 'Windows'
        run: python -c "import tempfile; from pathlib import Path; from scripts.windows.native_hosts import compile_host; compile_host(Path.cwd(), Path(tempfile.mkdtemp()) / 'vBot.exe', role='host', version='0.0.0')"
      - name: Run backend tests
        # Failed tests run once more, alone. Tests that then pass failed only under
        # the parallel load: they become a warning and the job stays green.
        shell: bash
        run: |
          status=0
          python -m pytest --durations=25 || status=$?
          if [ "$status" -ne 1 ]; then exit "$status"; fi
          python -c 'import json; print(*sorted(json.load(open(".pytest_cache/v/cache/lastfailed", encoding="utf-8"))), sep="\n")' > failed.txt
          if [ ! -s failed.txt ]; then exit 1; fi
          echo "::group::Run the $(wc -l < failed.txt) failed tests again, alone"
          python -m pytest --last-failed -n 0
          echo "::endgroup::"
          echo "::warning title=Flaky tests::Failed under the parallel load, passed when run again alone: $(paste -sd ' ' failed.txt)"
          {
            echo "### Flaky tests (${{ matrix.platform }}, Python ${{ matrix.python }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})"
            echo "Failed under the parallel load, passed when run again alone:"
            sed 's/^/- `/; s/$/`/' failed.txt
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run frontend tests
        run: npx vitest run
      - name: Build WebUI
        run: npm run build

  e2e:
    uses: ./.github/workflows/e2e.yml

  candidate-webui:
    name: build release candidate WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Build WebUI
        working-directory: webui
        run: npm run build
      - name: Package release candidate WebUI
        run: |
          test -s webui/dist/index.html
          tar -czf webui-dist.tar.gz -C . webui/dist resources/extensions
      - name: Upload release candidate WebUI
        uses: actions/upload-artifact@v7
        with:
          name: webui-release-candidate
          path: webui-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  candidate-smoke-linux:
    name: candidate-smoke-linux (${{ matrix.architecture }})
    needs: candidate-webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CANDIDATE_PORT: "8420"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Download release candidate WebUI
        uses: actions/download-artifact@v8
        with:
          name: webui-release-candidate
          path: .tmp/release-candidate
      - name: Prepare release candidate WebUI
        run: |
          tar -tzf .tmp/release-candidate/webui-dist.tar.gz >/dev/null
          tar -xzf .tmp/release-candidate/webui-dist.tar.gz
          test -s webui/dist/index.html
      - name: Install release candidate into an isolated environment
        run: |
          python -m venv .tmp/install-venv
          . .tmp/install-venv/bin/activate
          bash scripts/setup.sh \
            --no-autostart \
            --skip-webui-build \
            --host 127.0.0.1 \
            --port "$CANDIDATE_PORT" \
            --data-dir "${RUNNER_TEMP}/vbot-candidate-data"
          python -c 'import json, pathlib; state=json.loads(pathlib.Path(".vbot-install.json").read_text()); assert state["install_shape"] == "server"; assert state["dependency_groups"] == ["server", "cli"]'
      - name: Start, probe, and uninstall the release candidate
        run: |
          vbot=".tmp/install-venv/bin/vbot"
          candidate_data_dir="${RUNNER_TEMP}/vbot-candidate-data"
          "$vbot" server start \
            --host 127.0.0.1 \
            --port "$CANDIDATE_PORT" \
            --data-dir "$candidate_data_dir"
          curl -fsSL "http://127.0.0.1:${CANDIDATE_PORT}/health" \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl -fsSL "http://127.0.0.1:${CANDIDATE_PORT}/" -o "${RUNNER_TEMP}/candidate-webui-index.html"
          test -s "${RUNNER_TEMP}/candidate-webui-index.html"
          bash scripts/uninstall.sh
          test ! -f .vbot-install.json
          test -d "$candidate_data_dir"
          ! .tmp/install-venv/bin/python -m pip show vbot
      - name: Stop candidate server after a failure
        if: failure()
        run: |
          if [ -x .tmp/install-venv/bin/vbot ]; then
            .tmp/install-venv/bin/vbot server stop \
              --host 127.0.0.1 \
              --port "$CANDIDATE_PORT" \
              --data-dir "${RUNNER_TEMP}/vbot-candidate-data" || true
          fi

  candidate-smoke-windows:
    name: candidate-smoke-windows
    needs: candidate-webui
    runs-on: windows-latest
    env:
      CANDIDATE_PORT: "8420"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Download release candidate WebUI
        uses: actions/download-artifact@v8
        with:
          name: webui-release-candidate
          path: .tmp/release-candidate
      - name: Prepare release candidate WebUI
        shell: pwsh
        run: |
          tar.exe -tf .tmp/release-candidate/webui-dist.tar.gz | Out-Null
          tar.exe -xzf .tmp/release-candidate/webui-dist.tar.gz
          if (-not (Test-Path -LiteralPath webui/dist/index.html -PathType Leaf)) {
            throw "Release candidate WebUI is missing index.html"
          }
      - name: Install release candidate into an isolated environment
        shell: pwsh
        run: |
          $candidateDataDir = Join-Path $env:RUNNER_TEMP 'vbot-candidate-data'
          python -m venv .tmp/install-venv
          $env:Path = "$(Resolve-Path .tmp/install-venv/Scripts);$env:Path"
          & scripts/setup.ps1 `
            -NoAutostart `
            -SkipWebuiBuild `
            -SkipPathUpdate `
            -HostName 127.0.0.1 `
            -Port $env:CANDIDATE_PORT `
            -DataDir $candidateDataDir
          $state = Get-Content -Raw .vbot-install.json | ConvertFrom-Json
          if ($state.install_shape -ne 'server') { throw 'wrong install shape' }
          if (($state.dependency_groups -join ',') -ne 'server,cli') { throw 'wrong dependency groups' }
      - name: Start, probe, and uninstall the release candidate
        shell: pwsh
        run: |
          $candidateDataDir = Join-Path $env:RUNNER_TEMP 'vbot-candidate-data'
          $vbot = (Resolve-Path .tmp/install-venv/Scripts/vbot.exe).Path
          & $vbot server start `
            --host 127.0.0.1 `
            --port $env:CANDIDATE_PORT `
            --data-dir $candidateDataDir
          if ($LASTEXITCODE -ne 0) { throw 'server start failed' }
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:$env:CANDIDATE_PORT/health"
          if ($health.status -ne 'ok') { throw 'health probe returned an unexpected response' }
          $webui = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$env:CANDIDATE_PORT/"
          if ($webui.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace($webui.Content)) {
            throw 'WebUI probe failed'
          }
          & scripts/uninstall.ps1
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Test-Path .vbot-install.json) { throw 'installation manifest was not removed' }
          if (-not (Test-Path -LiteralPath $candidateDataDir -PathType Container)) {
            throw 'uninstall removed the data directory'
          }
          & .tmp/install-venv/Scripts/python.exe -m pip show vbot
          if ($LASTEXITCODE -eq 0) { throw 'vbot is still installed' }
          exit 0
      - name: Stop candidate server after a failure
        if: failure()
        shell: pwsh
        run: |
          $candidateDataDir = Join-Path $env:RUNNER_TEMP 'vbot-candidate-data'
          $vbot = '.tmp/install-venv/Scripts/vbot.exe'
          if (Test-Path -LiteralPath $vbot -PathType Leaf) {
            & $vbot server stop `
              --host 127.0.0.1 `
              --port $env:CANDIDATE_PORT `
              --data-dir $candidateDataDir
          }
          exit 0
