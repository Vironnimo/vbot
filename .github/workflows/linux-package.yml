name: Linux package

on:
  workflow_call:
    inputs:
      release_mode:
        description: Sign update archives with the configured release key
        required: false
        default: false
        type: boolean
      channel:
        description: Update channel the packages follow (release or main)
        required: false
        default: release
        type: string
      ref:
        description: Commit to build; the triggering commit when empty
        required: false
        default: ""
        type: string
    secrets:
      VBOT_RELEASE_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: Sign update archives with the configured release key
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A package is built on its own architecture: the builder runs the
          # runtime it packages.
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI assets
        run: |
          npm ci --prefix webui
          npm run build --prefix webui
      - name: Install the builder's dependencies
        run: python -m pip install httpx cryptography psutil
      - name: Build package and dependency inventory
        run: |
          revision="$(git rev-parse HEAD)"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${{ inputs.release_mode }}" = "true" ]; then
            python -c "from pathlib import Path; from scripts.package_build import verify_release_source; verify_release_source(Path('.'), '$revision')"
          fi
          arguments=(
            --source .
            --output build/linux
            --platform "${{ matrix.platform }}"
            --version "$version"
            --revision "$revision"
            --channel "${{ inputs.channel || 'release' }}"
            --cache "${RUNNER_TEMP}/vbot-runtime-cache"
          )
          python scripts/build_linux.py "${arguments[@]}"
      - name: Smoke packaged install, update, lifecycle and uninstall
        run: python scripts/linux/smoke.py --package "build/linux/${{ matrix.platform }}/server"
      - name: Stage flat release assets
        run: |
          files=build/linux/release-files
          mkdir -p "$files"
          cp "build/linux/artifacts/vbot-${{ matrix.platform }}-server.zip" "$files/"
          cp "build/linux/artifacts/vbot-${{ matrix.platform }}-server-runtime-inventory.json" "$files/"
          cp build/linux/artifacts/vbot-release.json "$files/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-${{ matrix.platform }}
          path: build/linux/release-files/*
          if-no-files-found: error

  sign:
    name: Sign Linux archives
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            scripts/sign_packages.py
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unsigned-linux-*
          path: assets
          merge-multiple: true
      - name: Install signing dependency
        if: inputs.release_mode
        run: >-
          python -m pip install --only-binary=:all: cryptography==50.0.1
      - name: Sign opaque update archives
        if: inputs.release_mode
        env:
          VBOT_RELEASE_SIGNING_KEY: ${{ secrets.VBOT_RELEASE_SIGNING_KEY }}
        run: python -I scripts/sign_packages.py --dir assets --platform linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vbot-linux
          path: assets/*
          if-no-files-found: error
