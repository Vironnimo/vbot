name: Release Smoke

# Canaries the public distribution path after publication. The package builds
# already smoke install, update, lifecycle and uninstall before publication; this
# workflow proves that both public installers acquire and install the published
# packages. Maintainers can dispatch it again for any release.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to install and verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to install and verify (for example, v0.1.10)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate released tag and distribution assets
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z, got $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > assets.txt
          python scripts/release_assets.py --names assets.txt --version "${RELEASE_TAG#v}"

  linux:
    name: linux (${{ matrix.architecture }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Install, start, probe, and uninstall the public release
        run: |
          install_dir="${RUNNER_TEMP}/vbot-release"
          data_dir="${HOME}/.vbot"
          installer="${RUNNER_TEMP}/install.sh"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install.sh" -o "$installer"
          bash "$installer" --dir "$install_dir" --version "$RELEASE_TAG" --no-autostart

          active="$(cat "$install_dir/active-version")"
          python3 - "$install_dir" "$active" "$RELEASE_TAG" <<'PY'
          import json, sys
          from pathlib import Path

          root, active, tag = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          state = json.loads((root / "application.json").read_text(encoding="utf-8"))
          release = json.loads((root / "versions" / active / "release.json").read_text(encoding="utf-8"))
          if state["install_shape"] != "server" or f"v{release['version']}" != tag:
              raise SystemExit(f"The installation does not hold the server of {tag}: {state}, {release}")
          PY
          test -L "$HOME/.local/bin/vbot"

          vbot="$HOME/.local/bin/vbot"
          "$vbot" server start
          curl -fsSL "http://127.0.0.1:8420/health" | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl -fsSL "http://127.0.0.1:8420/" -o "${RUNNER_TEMP}/webui-index.html"
          test -s "${RUNNER_TEMP}/webui-index.html"
          "$vbot" server stop

          "$vbot" uninstall --app-only --yes
          test ! -e "$install_dir"
          test ! -L "$HOME/.local/bin/vbot"
          test -d "$data_dir"

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Install, start, probe, and uninstall the public release
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "vbot-release-smoke"
          $dataDir = Join-Path $env:RUNNER_TEMP "vbot-release-smoke-data"
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/install.ps1" -OutFile $installer
          & $installer `
            -InstallDir $installDir `
            -DataDir $dataDir `
            -HostName "127.0.0.1" `
            -Port 8420 `
            -Version $env:RELEASE_TAG `
            -NoAutostart `
            -AllowElevatedInstall
          if ($LASTEXITCODE -ne 0) { throw "Native installer failed" }

          $statePath = Join-Path $installDir "application.json"
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { throw "Native application state is missing" }
          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          if ($state.schema_version -ne 1 -or [string]$state.install_shape -cne "server") {
            throw "Native application state does not describe the requested server install"
          }
          $activeVersion = (Get-Content -Raw -LiteralPath (Join-Path $installDir "active-version")).Trim()
          if ([string]::IsNullOrWhiteSpace($activeVersion)) { throw "Native active version is missing" }
          $releasePath = Join-Path $installDir "versions\$activeVersion\release.json"
          if (-not (Test-Path -LiteralPath $releasePath -PathType Leaf)) { throw "Active release manifest is missing" }
          $release = Get-Content -Raw -LiteralPath $releasePath | ConvertFrom-Json
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          if ([string]$release.version -cne $releaseVersion) {
            throw "Installed release version '$($release.version)' does not match tag '$env:RELEASE_TAG'"
          }

          $vbot = Join-Path $installDir "vBot.exe"
          if (-not (Test-Path -LiteralPath $vbot -PathType Leaf)) { throw "Native vBot executable is missing" }
          & $vbot server start
          if ($LASTEXITCODE -ne 0) { throw "Server start failed" }
          $status = (& $vbot server status) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $status -notmatch '(?m)^running: yes\s*$') {
            throw "Server status did not report a running vBot server"
          }
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8420/health"
          if ($health.status -ne "ok") { throw "Health probe returned an unexpected response" }
          $builtIndex = Join-Path $installDir "versions\$activeVersion\app\webui\dist\index.html"
          if (-not (Test-Path -LiteralPath $builtIndex -PathType Leaf)) { throw "Installed WebUI is missing" }
          $webui = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8420/"
          if ($webui.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace($webui.Content)) { throw "WebUI probe failed" }
          & $vbot server stop
          if ($LASTEXITCODE -ne 0) { throw "Server stop failed" }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $dataSentinel = Join-Path $dataDir "release-smoke-preserved.txt"
          Set-Content -LiteralPath $dataSentinel -Value "preserve" -NoNewline

          $uninstallers = @(
            Get-ChildItem -LiteralPath $installDir -File | Where-Object {
              $_.Name -match '^unins\d{3}\.exe$'
            }
          )
          if ($uninstallers.Count -ne 1) { throw "Native uninstaller is missing or ambiguous" }
          $uninstall = Start-Process `
            -FilePath $uninstallers[0].FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Native uninstaller failed with code $($uninstall.ExitCode)" }
          foreach ($path in @(
            (Join-Path $installDir "vBot.exe"),
            (Join-Path $installDir "application.json"),
            (Join-Path $installDir "active-version"),
            (Join-Path $installDir "versions")
          )) {
            if (Test-Path -LiteralPath $path) { throw "Native uninstall retained application path: $path" }
          }
          if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw "Uninstall removed the data directory" }
          if ((Get-Content -Raw -LiteralPath $dataSentinel) -cne "preserve") { throw "Uninstall changed data" }
