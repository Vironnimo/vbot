name: Windows package

on:
  workflow_call:
    inputs:
      release_mode:
        description: Sign update archives with the configured release key
        required: false
        default: false
        type: boolean
      channel:
        description: Update channel the packages follow (release or main)
        required: false
        default: release
        type: string
      ref:
        description: Commit to build; the triggering commit when empty
        required: false
        default: ""
        type: string
      release_smoke:
        description: Also provision managed speech in the server smoke and smoke the compiled installer
        required: false
        default: true
        type: boolean
    secrets:
      VBOT_RELEASE_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: Sign update archives with the configured release key
        required: false
        default: false
        type: boolean
      release_smoke:
        description: Also provision managed speech in the server smoke and smoke the compiled installer
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shape: [server, server-desktop, desktop-client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI assets
        if: matrix.shape != 'desktop-client'
        shell: pwsh
        run: |
          npm ci --prefix webui
          npm run build --prefix webui
      - name: Ensure native compilers
        shell: pwsh
        run: choco install llvm innosetup --no-progress -y
      - name: Build package and dependency inventory
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("${{ inputs.release_mode }}" -eq "true") {
            python -c "from pathlib import Path; from scripts.package_build import verify_release_source; verify_release_source(Path('.'), '$revision')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $arguments = @(
            "--source", ".",
            "--runtime", $env:pythonLocation,
            "--output", "build/windows",
            "--shape", "${{ matrix.shape }}",
            "--version", $version,
            "--revision", $revision,
            "--channel", "${{ inputs.channel || 'release' }}"
          )
          python scripts/build_windows.py @arguments
      - name: Smoke packaged lifecycle
        shell: pwsh
        run: |
          $arguments = @(
            "--package", "build/windows/windows-x86_64/${{ matrix.shape }}"
          )
          if ("${{ matrix.shape }}" -eq "server" -and "${{ inputs.release_smoke }}" -eq "true") {
            $arguments += "--speech"
          }
          python scripts/windows/smoke.py @arguments
      - name: Upload packaged smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vbot-windows-smoke-evidence-${{ matrix.shape }}
          path: build/windows/smoke-evidence/${{ matrix.shape }}
          if-no-files-found: warn
      - name: Compile per-user installer
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $shortRevision = $revision.Substring(0, 12)
          $safeVersion = $version -replace '[^a-z0-9]+', '_'
          $versionId = "v${safeVersion}_$shortRevision"
          $publicKey = ""
          if ("${{ inputs.release_mode }}" -eq "true") {
            $publicKey = python -I scripts/sign_packages.py --public-key-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DPayloadDir=$pwd\build\windows\windows-x86_64\${{ matrix.shape }}" `
            "/DBuildOutputDir=$pwd\build\windows\installers" `
            "/DAppVersion=$version" `
            "/DInstallShape=${{ matrix.shape }}" `
            "/DVersionId=$versionId" `
            "/DReleasePublicKey=$publicKey" `
            "/DUpdateChannel=${{ inputs.channel || 'release' }}" `
            scripts/windows/vbot.iss
      - name: Smoke native installer and uninstall
        if: inputs.release_smoke
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & scripts/windows/smoke_installer.ps1 `
            -Installer "build/windows/installers/vBot-$version-windows-x86_64-${{ matrix.shape }}.exe" `
            -Shape "${{ matrix.shape }}" `
            -Version $version
      - name: Stage flat release assets
        shell: pwsh
        run: |
          $releaseFiles = "build/windows/release-files"
          New-Item -ItemType Directory -Force $releaseFiles | Out-Null
          Copy-Item "build/windows/artifacts/vbot-windows-x86_64-${{ matrix.shape }}.zip" $releaseFiles
          Copy-Item "build/windows/artifacts/vbot-windows-x86_64-${{ matrix.shape }}-runtime-inventory.json" $releaseFiles
          Copy-Item "build/windows/installers/vBot-*-windows-x86_64-${{ matrix.shape }}.exe" $releaseFiles
          Copy-Item "build/windows/artifacts/vbot-release.json" $releaseFiles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-${{ matrix.shape }}
          path: build/windows/release-files/*
          if-no-files-found: error

  sign:
    name: Sign Windows archives
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            scripts/sign_packages.py
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unsigned-windows-*
          path: assets
          merge-multiple: true
      - name: Install signing dependency
        if: inputs.release_mode
        run: >-
          python -m pip install --only-binary=:all: cryptography==50.0.1
      - name: Sign opaque update archives
        if: inputs.release_mode
        env:
          VBOT_RELEASE_SIGNING_KEY: ${{ secrets.VBOT_RELEASE_SIGNING_KEY }}
        run: python -I scripts/sign_packages.py --dir assets --platform windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vbot-windows
          path: assets/*
          if-no-files-found: error
