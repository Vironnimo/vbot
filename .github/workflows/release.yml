name: Release

# Runs the complete CI workflow and builds and smokes the signed packages of every
# platform before creating the tag and published release. The release is created
# with all of them attached, so it is never publicly visible without a package an
# installation needs. Built files stay untracked.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the leading v (for example, 0.1.10)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  windows:
    uses: ./.github/workflows/windows-package.yml
    with:
      release_mode: true
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux-package.yml
    with:
      release_mode: true
    secrets: inherit

  publish:
    needs: [quality, windows, linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release metadata
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit(f"Release version must be SemVer X.Y.Z, got {version!r}")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project["version"] != version:
              raise SystemExit(
                  f"Release version {version!r} does not match pyproject.toml {project['version']!r}"
              )
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          pattern: vbot-*
          path: assets
          merge-multiple: true

      # The installers verify their downloads against the digests vbot-release.json records.
      - name: Validate complete release assets and record their digests
        run: >-
          python scripts/release_assets.py --dir assets --version "${RELEASE_VERSION}"
          --revision "${GITHUB_SHA}" --channel release --record-digests

      - name: Publish release with all verified installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}"
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --generate-notes
          assets/*

  smoke:
    needs: publish
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: v${{ inputs.version }}
